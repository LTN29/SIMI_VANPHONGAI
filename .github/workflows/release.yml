# Phát hành Văn Phòng AI: đẩy nhãn v<phiên bản> (vd v0.9.12) → test → build Windows / macOS (chip Apple + Intel) / Ubuntu → tạo GitHub Release
# kèm file cài. Gateway (VANPHONG_GITHUB_REPO) tự lấy Release mới và đăng → máy nhân viên hiện "Cập nhật ngay".
# Ghi chú bản mới = nội dung của nhãn (git tag -a v0.9.12 -m "- Có gì mới").
name: Phát hành

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Phiên bản trong package.json khớp nhãn
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ "$V" != "$GITHUB_REF_NAME" ]; then echo "::error::package.json là $V nhưng nhãn là $GITHUB_REF_NAME – sửa version rồi đẩy nhãn lại"; exit 1; fi
      - run: npm run lint
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          if-no-files-found: error
          path: dist/VanPhongAI-*-Setup.exe

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:linux -- --publish never
      # gói code cho "cập nhật nhanh" (mọi hệ điều hành, ~3,5 MB): app chỉ thay phần code, không đổi file chạy
      - run: node build/make-app-asar.js dist
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/VanPhongAI-*-linux-amd64.deb
            dist/VanPhongAI-*-linux-x86_64.AppImage
            dist/VanPhongAI-*-app-e*.asar

  # macOS build trên máy Mac của GitHub (repo công khai: miễn phí) để ký ad-hoc (build/mac-adhoc-sign.js) và làm file .dmg:
  # người dùng mở app bằng giao diện (Quyền riêng tư & Bảo mật → Vẫn mở), không cần Terminal. .zip giữ cho app tự cập nhật.
  build-mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac -- --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Kiểm tra chữ ký ad-hoc
        run: for a in dist/mac*/VanPhongAI.app; do codesign --verify --deep --strict "$a" && codesign -dv "$a" 2>&1 | grep -i signature; done
      - uses: actions/upload-artifact@v6
        with:
          name: mac
          if-no-files-found: error
          path: |
            dist/VanPhongAI-*-mac-arm64.zip
            dist/VanPhongAI-*-mac-x64.zip
            dist/VanPhongAI-*-mac-arm64.dmg
            dist/VanPhongAI-*-mac-x64.dmg

  release:
    needs: [build-windows, build-linux, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - name: Ghi chú bản mới (nội dung nhãn)
        run: |
          git fetch --force --tags
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' | sed '/-----BEGIN PGP/,$d' > notes.md
          [ -s notes.md ] || echo "Văn Phòng AI ${GITHUB_REF_NAME#v}" > notes.md
          cat notes.md; ls -la out
      - name: Tạo Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "Văn Phòng AI ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
